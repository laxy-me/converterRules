[custom]
;This is an example external configuration file
;All possible customization settings are shown below

;Options for custom groups
;custom_proxy_group=Proxy`select`.*`[]AUTO`[]DIRECT`.*
;custom_proxy_group=AUTO`url-test`.*`http://www.gstatic.com/generate_204`300
;custom_proxy_group=google`select`.*
;custom_proxy_group=netflix`select`.*
;custom_proxy_group=动画疯`select`(深台|彰化|新北|台)
;custom_proxy_group=fox+`select`(HGC|HKBN|PCCW|HKT|深台|彰化|新北|台|新加坡|sg|hk|tw)
;custom_proxy_group=美区影视`select`(美|美国)
;custom_proxy_group=Global_media`select`.*
;custom_proxy_group=Domestic`select`[]DIRECT`[]Proxy
;custom_proxy_group=Apple`select`[]DIRECT`[]Proxy
;custom_proxy_group=Final`select`[]Proxy`[]DIRECT
;custom_proxy_group=屏蔽广告`select`[]REJECT`[]DIRECT
;custom_proxy_group=UnblockNeteaseMusic`select`云音乐解锁`[]DIRECT
; 核心组原来是 custom_proxy_group=!!import:snippets/groups.txt，引用的是 subconverter 镜像自带的
; 文件（容器内 /base/snippets/groups.txt，2024-04 版），不在本仓库，换镜像会悄悄变。
; 2026-11-04 照原样搬进来（原文件里注释掉的三行没搬），只改了 🔰 节点选择：默认选 🔰 自动兜底，
; 不再死守一个节点 —— 11-03 它手动选的 Relay-JP1 挂了，Google、GitHub 全断。
;   🔰 自动兜底（fallback，测 IPv4 通不通）：⚡ 非港优选 → ♻️ 自动选择
;   ⚡ 非港优选（url-test）：非香港节点里挑能出 IPv6 的最快的。测 ipv6.google.com 是因为
;     override-destination 是 false：客户端连的是 IPv6 地址，就原样交给节点，节点出不了 IPv6
;     就断（11-03 JP-06 踩过）。香港不参与是有意的选择。
; ⚠️ 面板上组的选择会持久化（store-selected）：改了组的默认成员，已有的选择不会跟着变，
;   要在面板里（或用 API）把它选到新的自动组上。
custom_proxy_group=🔰 节点选择`select`[]🔰 自动兜底`[]♻️ 自动选择`[]🎯 全球直连`.*
custom_proxy_group=🔰 自动兜底`fallback`[]⚡ 非港优选`[]♻️ 自动选择`http://www.gstatic.com/generate_204`300
custom_proxy_group=⚡ 非港优选`url-test`^(?!.*(HK|港)).*$`http://ipv6.google.com/generate_204`300
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300
custom_proxy_group=🌍 国外媒体`select`[]🔰 节点选择`[]♻️ 自动选择`[]🎯 全球直连`.*
custom_proxy_group=🌏 国内媒体`select`[]🎯 全球直连`(HGC|HKBN|PCCW|HKT|深台|彰化|新北|台|hk|港|tw)`[]🔰 节点选择
custom_proxy_group=Ⓜ️ 微软服务`select`[]🎯 全球直连`[]🔰 节点选择`.*
custom_proxy_group=📲 电报信息`select`[]🔰 节点选择`[]🎯 全球直连`.*
custom_proxy_group=🍎 苹果服务`select`[]🔰 节点选择`[]🎯 全球直连`[]♻️ 自动选择`.*
custom_proxy_group=🎯 全球直连`select`[]DIRECT
custom_proxy_group=🛑 全球拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🔰 节点选择`[]🎯 全球直连`[]♻️ 自动选择`.*
; 以下是本仓库自己的组。🤖 AI、🎥 NETFLIX 默认选各自的自动组（fallback：按顺序用第一个活着的，
; 出口稳定，适合 AI 的长连接），挂了自动换；测的是真实目标。AI 服务封香港，所以只在 JP/US/SG 里选；
; NETFLIX 只在香港里选（港区片库）。
custom_proxy_group=🤖 AI`select`[]🤖 AI自动`JP|US|SG
custom_proxy_group=🤖 AI自动`fallback`JP|US|SG`https://api.anthropic.com/`300
custom_proxy_group=💬 FCM`fallback`(HK|港)`[]♻️ 自动选择`http://www.gstatic.com/generate_204`300
custom_proxy_group=🎥 NETFLIX`select`[]🎥 NETFLIX自动`HK
custom_proxy_group=🎥 NETFLIX自动`fallback`HK`https://www.netflix.com/`300
custom_proxy_group=🏢 办公优选`url-test`(HK|港)`https://slack.com/`300
custom_proxy_group=🏢 办公`fallback`[]🏢 办公优选`[]♻️ 自动选择`https://slack.com/`300

