; ruleset=DIRECT,https://raw.githubusercontent.com/ConnersHua/Profiles/master/Surge/Ruleset/China.list
; 规则经 jsDelivr 拉取（subconverter 在阿里云上海，raw.githubusercontent.com 被墙）。
; 本仓库的文件用 @latest：每次推送由 Action 自动打 tag 并刷新，一分钟内生效；
; 第三方仓库用 @master，jsDelivr 对分支最长缓存 12 小时，上游改动会晚半天到。
; 2026-11-04 规则源从镜像快照换成远程表。原来的 rules/... 是 subconverter 镜像里打包的
; 快照，其中 DivineEngine（ConnersHua/Profiles）、lhie1 上游早已停更。选源原则：
;   - 有上游远程版的换成远程版：NobyDa AdRule（8641 条，unbreak.list 是照它调的误伤放行）、
;     NobyDa Download、blackmatrix7 Hijacking（替代 DivineEngine 同名表）；
;   - 已停更的换 ACL4SSR 对等表；lhie1 的 6 个国内媒体表由 ACL4SSR ChinaMedia 覆盖。
; ⚠️ 远程表本身也多半不新（11-04 按 GitHub 提交记录查）：ACL4SSR 每天的提交只是机器人更新
;   Clash/Ruleset/ 下那份 GFWList，这里用的 ACL4SSR 表停在 2023-03～2026-01；NobyDa AdRule
;   2023-12、Download 2020-04；blackmatrix7 Hijacking、Oracle 2025-06。
; 2026-11-04 起 AI、Netflix、Telegram、GitHub、国内域名先过 GEOSITE（v2fly 域名列表，每天更新），
;   旧表留在后面补漏：AI 旧表多 auth0、arkoselabs、statsig 这类登录/验证码/埋点域名，Netflix、
;   Telegram 旧表有 IP 段，ChinaDomain 有刻意直连的 Steam、PlayStation、Epic 下载域名；
;   GitHub 旧表 6 条全被覆盖，直接换掉。
;   - 只用 v2fly 原版分类：手机 Stash 只认这些（gfw 是 Loyalsoldier 加的，Stash 没有）。
;   - subconverter 会丢掉远程表里的 GEOSITE 行，GEOSITE 只能在 ruleset 里单写 []GEOSITE,分类。
;   - 各端 GEOSITE 数据不同，同名分类大小可能差很多：广告 category-ads-all 在家里 mihomo 用的
;     Loyalsoldier 版有 19.5 万条，MetaCubeX 版只有 903 条。
; 没换的：广告（各端差太多，家里广告本来靠 AdGuard）、被墙域名（Stash 没有 gfw）、微软（v2fly 的
;   microsoft 含 github.com、onedrive，放直连组会把 GitHub 带成直连）；苹果、媒体、局域网、
;   UnBan、Oracle、下载这些域名本身稳定，旧表够用。细节见 home-network 仓库 mihomo/README.md §3。
; ⚠️ 订阅链接里的 config= 要填本文件的 jsDelivr 地址，不能填 raw.githubusercontent.com：
;   ECS 连不上 GitHub raw，subconverter 拿不到 ini 时不报错、悄悄改用镜像自带的默认配置。
; ⚠️ ACL4SSR 的同名表在 Clash/ 和 Clash/Ruleset/ 下内容不一样，换表前先比条数和差异：
;   UnBan 必须用 Clash/ 根目录那份 —— Ruleset/ 版多放行 30 多个 Google 域名直连
;   （fonts.googleapis.com、*.gstatic.com、*.pki.goog…），在这里直连不通。
; ⚠️ ECS 拉 jsDelivr 偶尔超时，subconverter 拉失败会静默跳过该表（这个版本没有
;   serve_cache_on_fetch_fail）；mihomo 侧的 sub-update 有规则数闸门兜底。
