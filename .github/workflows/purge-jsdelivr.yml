# 推送后发布新版本并刷新 jsDelivr 缓存。
#
# 订阅转换（subconverter）跑在阿里云上海的 ECS 上，raw.githubusercontent.com 在大陆被墙，
# 所以 ini 和清单都经 cdn.jsdelivr.net 拉取。jsDelivr 对分支地址（@master）最长缓存 12 小时，
# 而 purge 只对 semver 版本生效，所以本仓库的文件一律用 @latest 引用：
# 每次推送打一个新 tag（1.<run_number>.<run_attempt>），再刷新 @latest，改动一两分钟内生效。
name: Release & purge jsDelivr

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag
        id: tag
        run: |
          tag="1.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          git tag "$tag"
          git push origin "$tag"
          echo "tag=$tag" | tee -a "$GITHUB_OUTPUT"
      - name: Purge @latest
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # 推完 tag 马上刷新会扑空：jsDelivr 还不知道有新 tag，刷完 @latest 仍是上一版，purge 照样回 finished
          # （2026-11-10：tag 推送后 0.5 秒刷新，@latest 停在旧版，4 分钟后先按新 tag 拉一次再刷才好）。
          # 所以先按新 tag 把文件拉一遍，再刷新 @latest，然后逐个比对 @latest 和新 tag 的内容，不一致就等一会儿重刷。
          files=$(git ls-files '*.ini' '*.list')
          cdn="https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}"
          for f in $files; do
            curl -fsS --retry 5 --retry-all-errors -o /dev/null "$cdn@$TAG/$f"
          done
          for attempt in 1 2 3 4 5 6; do
            for f in $files; do
              curl -fsS --retry 3 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@latest/$f" >/dev/null
            done
            sleep 10
            stale=""
            for f in $files; do
              [ "$(curl -fsS "$cdn@latest/$f" | sha256sum)" = "$(curl -fsS "$cdn@$TAG/$f" | sha256sum)" ] || stale="$stale $f"
            done
            if [ -z "$stale" ]; then
              echo "第 $attempt 次刷新后 @latest 已是 $TAG"
              exit 0
            fi
            echo "第 $attempt 次刷新后还是旧版:$stale"
            sleep 20
          done
          echo "::error::刷新 6 次 @latest 仍不是 $TAG"
          exit 1
