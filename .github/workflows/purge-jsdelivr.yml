# 推送后刷新 jsDelivr 缓存。
#
# 订阅转换（subconverter）跑在阿里云上海的 ECS 上，raw.githubusercontent.com 在大陆被墙，
# 所以 ini 和清单都改成经 cdn.jsdelivr.net 拉取。jsDelivr 对 @master 这类分支地址最长缓存 12 小时，
# 不主动刷新的话，改了规则要等半天才生效。
name: Purge jsDelivr cache

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Purge all .ini / .list files
        run: |
          for f in $(git ls-files '*.ini' '*.list'); do
            echo "== $f"
            curl -fsS --retry 3 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@master/${f}" | grep -o '"status": *"[a-z]*"'
          done
